name: CWS-Publish

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Chrome Web StorePublish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-node@v1
        with:
          node-version: 24
      
      - name: Build
        run: |
          npm ci
          npm run build
          cd dist && zip -r GridBookmarkTab.zip GridBookmarkTab

      - name: Check if manifest version changed
        id: check_version
        run: |
          # 提取当前与上一个版本号
          current_version=$(jq -r '.version' src/manifest.json)
          prev_version=$(git show HEAD~1:src/manifest.json 2>/dev/null | jq -r '.version' || echo "none")

          echo "Current version: $current_version"
          echo "Previous version: $prev_version"

          if [ "$current_version" != "$prev_version" ]; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload & release
        if: steps.check_version.outputs.version_changed == 'true'
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: dist/GridBookmarkTab.zip
          extension-id: hemjkalhbidbfhdblgdapmlpopmeaigd
          client-id: ${{ secrets.GCLOUD_CLIENT_ID }}
          client-secret: ${{ secrets.GCLOUD_CLIENT_SECRET }}
          refresh-token: ${{ secrets.GCLOUD_REFRESH_TOKEN }}
