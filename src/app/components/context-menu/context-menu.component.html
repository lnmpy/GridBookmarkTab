<div class="context-menu" role="menu">
  <div class="surface glass-overlay elev-3 rounded-xl p-1.5 flex flex-col gap-px text-[13px]">
    @for (item of items; track item) {
      <button
        type="button"
        role="menuitem"
        (click)="onSelect(item)"
        class="w-full h-[34px] px-2.5 rounded-[7px] text-left whitespace-nowrap text-base-content hover:bg-chip transition-colors cursor-pointer"
      >
        {{ item.label }}
      </button>
    }
  </div>
</div>
