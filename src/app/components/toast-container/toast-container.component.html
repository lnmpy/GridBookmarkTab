<div class="toast toast-start fixed z-50 flex gap-2">
  @for (toast of toastService.toasts$ | async; track toast) {
    <div
      class="alert surface glass-overlay elev-3 justify-between items-center text-[13px] rounded-xl animate-in slide-in-from-left duration-300"
    >
      <span
        class="w-1.5 h-1.5 rounded-full shrink-0"
        [style.background]="
          'var(--color-' +
          (!toast.type || toast.type === 'info' ? 'primary' : toast.type) +
          ')'
        "
        aria-hidden="true"
      ></span>
      <span class="flex-1">{{ toast.message }}</span>
      @if (toast.action; as action) {
        <button
          type="button"
          class="btn btn-ghost btn-xs rounded-md text-primary font-semibold hover:bg-chip"
          (click)="toastService.runAction(toast)"
        >
          {{ action.label }}
        </button>
      }
      <button
        class="btn btn-ghost btn-xs btn-square ml-auto rounded-md text-ink-2 hover:bg-chip"
        (click)="toastService.remove(toast.id)"
      >
        <ng-icon name="hero-x-mark" class="w-4 h-4" />
      </button>
    </div>
  }
</div>
