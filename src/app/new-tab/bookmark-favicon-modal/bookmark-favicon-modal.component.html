<div class="modal modal-open">
  <div class="modal-box w-11/12 max-w-lg sm:max-w-xl">
    <h3 class="font-bold text-base sm:text-lg md:text-xl mb-4">{{ title }}</h3>

    <div class="space-y-4 sm:space-y-6">
      <!-- Current Favicon Preview -->
      <div class="flex flex-col gap-2" *ngIf="currentFaviconUrl">
        <label class="label text-xs sm:text-sm font-semibold">{{ i18n.t('currentFavicon') }}</label>
        <div class="flex items-center gap-3 p-3 bg-base-200/50 rounded-lg">
          <img
            [src]="currentFaviconUrl"
            class="w-12 h-12 rounded-lg shadow-sm"
            alt="Current favicon"
          />
          <span class="text-xs text-base-content/70 truncate flex-1">{{ bookmark.title }}</span>
        </div>
      </div>

      <!-- Image URL Input -->
      <div class="flex flex-col gap-2">
        <label class="label text-xs sm:text-sm font-semibold">
          {{ i18n.t('faviconImageUrl') }}
          <span class="text-xs text-base-content/50 font-normal ml-2">{{ i18n.t('copyImageAddressHint') }}</span>
        </label>
        <input
          type="text"
          [(ngModel)]="faviconUrl"
          (ngModelChange)="onUrlChange()"
          placeholder="https://example.com/favicon.png"
          class="input input-bordered input-sm w-full input-radius"
          [class.input-error]="errorMessage"
        />
        <p class="text-xs text-error" *ngIf="errorMessage">{{ errorMessage }}</p>
      </div>

      <!-- Preview -->
      <div class="flex flex-col gap-2" *ngIf="previewUrl && !errorMessage">
        <label class="label text-xs sm:text-sm font-semibold">{{ i18n.t('preview') }}</label>
        <div class="flex items-center gap-3 p-3 bg-base-200/50 rounded-lg">
          <img
            [src]="previewUrl"
            class="w-12 h-12 rounded-lg shadow-sm"
            alt="Preview"
            (error)="errorMessage = i18n.t('failedToLoadPreview')"
          />
          <span class="text-xs text-success">{{ i18n.t('imageLoadedSuccess') }}</span>
        </div>
      </div>

      <!-- Instructions -->
      <div class="alert alert-info rounded-lg p-3 text-xs">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="stroke-current shrink-0 w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <div>
          <p class="font-semibold">{{ i18n.t('howToUse') }}</p>
          <ol class="list-decimal list-inside mt-1 space-y-1">
            <li>{{ i18n.t('howToUseStep1') }}</li>
            <li>{{ i18n.t('howToUseStep2') }}</li>
            <li>{{ i18n.t('howToUseStep3') }}</li>
            <li>{{ i18n.t('howToUseStep4') }}</li>
          </ol>
        </div>
      </div>
    </div>

    <!-- Modal Actions -->
    <div class="modal-action flex-col sm:flex-row gap-2 mt-6">
      <button
        class="btn btn-sm btn-primary btn-refined button-radius w-full sm:w-auto"
        (click)="onConfirm()"
        [disabled]="isLoading || !faviconUrl.trim() || !!errorMessage"
      >
        <span *ngIf="!isLoading">{{ i18n.t('save') }}</span>
        <span *ngIf="isLoading" class="loading loading-spinner loading-xs"></span>
        <span *ngIf="isLoading">{{ i18n.t('saving') }}</span>
      </button>
      <button
        class="btn btn-sm btn-refined button-radius w-full sm:w-auto"
        (click)="onCancel()"
        [disabled]="isLoading"
      >
        {{ i18n.t('cancel') }}
      </button>
    </div>
  </div>
</div>
