<div class="modal modal-open">
  <div class="modal-box w-11/12 max-w-lg sm:max-w-xl md:max-w-2xl">
    <h3 class="font-bold text-base sm:text-lg md:text-xl">{{ title }}</h3>
    <div class="py-4 space-y-3 sm:space-y-4 w-full">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
        <label class="label text-xs sm:text-sm font-semibold">{{ i18n.t('title') }}</label>
        <input
          type="text"
          [(ngModel)]="bookmarkTitle"
          class="input input-bordered input-sm w-full sm:w-8/10 input-radius"
        />
      </div>
      <div
        *ngIf="bookmarkType === 'bookmark'"
        class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-2"
      >
        <label class="label text-xs sm:text-sm font-semibold sm:mt-1">{{ i18n.t('url') }}</label>
        <div class="w-full sm:w-8/10">
          <input
            type="text"
            [(ngModel)]="bookmarkUrl"
            (ngModelChange)="onUrlChange()"
            class="input input-bordered input-sm w-full input-radius"
            [class.input-error]="urlError"
          />
          <p *ngIf="urlError" class="text-error text-xs mt-1">{{ urlError }}</p>
        </div>
      </div>
      <div
        *ngIf="bookmarkType === 'bookmark'"
        class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-2"
      >
        <label class="label text-xs sm:text-sm font-semibold sm:mt-1">
          {{ i18n.t('faviconImageUrl') }}
        </label>
        <div class="w-full sm:w-8/10 space-y-1">
          <div class="flex gap-2 items-center">
            <div
              *ngIf="previewFaviconUrl"
              class="w-8 h-8 rounded shrink-0 bg-base-200 border border-base-300 flex items-center justify-center overflow-hidden p-0.5"
            >
              <img
                [src]="previewFaviconUrl"
                class="w-full h-full object-contain"
                alt="Favicon"
                (error)="faviconError = i18n.t('failedToLoadPreview')"
              />
            </div>
            <input
              type="text"
              [(ngModel)]="faviconUrl"
              (ngModelChange)="onFaviconUrlChange()"
              placeholder="https://example.com/favicon.png, <svg...>, or Data URI"
              class="input input-bordered input-sm flex-1 input-radius"
              [class.input-error]="faviconError"
            />
            <input
              type="file"
              #fileInput
              accept=".svg,image/svg+xml,image/*"
              (change)="onFileSelected($event)"
              class="hidden"
            />
            <details #actionDropdown class="dropdown dropdown-end shrink-0">
              <summary
                class="btn btn-sm btn-outline button-radius flex items-center gap-1 cursor-pointer list-none"
                [class.btn-disabled]="isFaviconLoading"
                [title]="i18n.t('getIcon')"
              >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <span class="hidden sm:inline">{{ i18n.t('getIcon') }}</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 opacity-70 ml-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
              </summary>
              <ul class="dropdown-content z-[10] menu p-1.5 shadow-lg bg-base-100 rounded-box w-44 mt-1 border border-base-200 text-xs">
                <li>
                  <button
                    type="button"
                    class="flex items-center gap-2 py-2"
                    (click)="triggerFileInput(fileInput, actionDropdown)"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                    </svg>
                    <span>{{ i18n.t('uploadLocalFile') }}</span>
                  </button>
                </li>
                <li>
                  <button
                    type="button"
                    class="flex items-center gap-2 py-2"
                    (click)="onSearchIcon(actionDropdown)"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <span>{{ i18n.t('searchIcon') }}</span>
                  </button>
                </li>
              </ul>
            </details>
          </div>
          <p *ngIf="faviconError" class="text-error text-xs">{{ faviconError }}</p>
        </div>
      </div>
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
        <label class="label text-xs sm:text-sm font-semibold">Folder</label>
        <select class="select select-bordered select-sm w-full sm:w-8/10 input-radius" [(ngModel)]="bookmarkParentId">
          <option
            *ngFor="let f of bookmarkFolders"
            [value]="f.id"
            [ngStyle]="{ 'padding-left': f.depth + 'rem' }"
          >
            {{ f.title }}
          </option>
        </select>
      </div>
      <div class="modal-action flex-col sm:flex-row gap-2 mt-6">
        <button
          class="btn btn-sm btn-primary btn-refined button-radius w-full sm:w-auto"
          (click)="onConfirm()"
          [disabled]="isFaviconLoading"
        >
          <span *ngIf="!isFaviconLoading">{{ i18n.t('save') }}</span>
          <span *ngIf="isFaviconLoading" class="loading loading-spinner loading-xs"></span>
          <span *ngIf="isFaviconLoading">{{ i18n.t('saving') }}</span>
        </button>
        <button
          class="btn btn-sm btn-refined button-radius w-full sm:w-auto"
          (click)="onCancel()"
          [disabled]="isFaviconLoading"
        >
          {{ i18n.t('cancel') }}
        </button>
      </div>
    </div>
  </div>
</div>
