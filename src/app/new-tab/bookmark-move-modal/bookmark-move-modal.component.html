<div class="modal modal-open">
  <div class="modal-box w-11/12 max-w-lg sm:max-w-xl">
    <h3 class="font-bold text-base sm:text-lg md:text-xl">
      {{ i18n.t("moveToFolderTitle") }}
      <span class="text-sm font-normal text-base-content/60 ml-2">
        ({{ i18n.t("selectedCount", [selectedBookmarkIds.length.toString()]) }})
      </span>
    </h3>

    <div class="py-4 space-y-4 w-full">
      <!-- Mode selection radio buttons -->
      <div class="flex items-center gap-6">
        <label class="label cursor-pointer flex items-center gap-2">
          <input
            type="radio"
            name="moveMode"
            value="existing"
            [(ngModel)]="mode"
            class="radio radio-sm radio-primary"
          />
          <span class="label-text text-sm font-medium">{{
            i18n.t("selectTargetFolder")
          }}</span>
        </label>
        <label class="label cursor-pointer flex items-center gap-2">
          <input
            type="radio"
            name="moveMode"
            value="new"
            [(ngModel)]="mode"
            class="radio radio-sm radio-primary"
          />
          <span class="label-text text-sm font-medium">{{
            i18n.t("createNewFolder")
          }}</span>
        </label>
      </div>

      <!-- Existing folder selection -->
      @if (mode === "existing") {
        <div class="flex flex-col gap-2">
          <label class="label text-xs sm:text-sm font-semibold p-0">{{
            i18n.t("folder")
          }}</label>
          <select
            class="select select-bordered select-sm w-full input-radius"
            [(ngModel)]="selectedTargetFolderId"
          >
            @for (f of bookmarkFolders; track f) {
              <option
                [value]="f.id"
                [ngStyle]="{ 'padding-left': f.depth + 'rem' }"
              >
                {{ f.title }}
              </option>
            }
          </select>
        </div>
      }

      <!-- New folder creation -->
      @if (mode === "new") {
        <div class="space-y-3">
          <div class="flex flex-col gap-2">
            <label class="label text-xs sm:text-sm font-semibold p-0">{{
              i18n.t("newFolderName")
            }}</label>
            <input
              type="text"
              [(ngModel)]="newFolderName"
              class="input input-bordered input-sm w-full input-radius"
              placeholder="..."
            />
          </div>
          <div class="flex flex-col gap-2">
            <label class="label text-xs sm:text-sm font-semibold p-0">{{
              i18n.t("folder")
            }}</label>
            <select
              class="select select-bordered select-sm w-full input-radius"
              [(ngModel)]="newFolderParentId"
            >
              @for (f of bookmarkFolders; track f) {
                <option
                  [value]="f.id"
                  [ngStyle]="{ 'padding-left': f.depth + 'rem' }"
                >
                  {{ f.title }}
                </option>
              }
            </select>
          </div>
        </div>
      }

      <!-- Buttons -->
      <div class="modal-action flex-col sm:flex-row gap-2 mt-6">
        <button
          class="btn btn-sm btn-primary btn-refined button-radius w-full sm:w-auto"
          [disabled]="isSubmitting || (mode === 'new' && !newFolderName.trim())"
          (click)="onConfirm()"
        >
          {{ i18n.t("move") }}
        </button>
        <button
          class="btn btn-sm btn-refined button-radius w-full sm:w-auto"
          (click)="onCancel()"
        >
          {{ i18n.t("cancel") }}
        </button>
      </div>
    </div>
  </div>
</div>
