<div class="modal modal-open">
  <div class="modal-box w-11/12 max-w-lg sm:max-w-xl">
    <h3 class="font-bold text-base sm:text-lg md:text-xl">{{ title }}</h3>
    <div class="modal-action flex-col sm:flex-row gap-2">
      <button
        class="btn btn-sm w-full sm:w-auto"
        [class]="confirmButtonClass"
        (click)="onConfirm()"
      >
        Confirm
      </button>
      <button
        class="btn btn-sm w-full sm:w-auto"
        [class]="cancelButtonClass"
        (click)="onCancel()"
      >
        Cancel
      </button>
    </div>
  </div>
</div>
