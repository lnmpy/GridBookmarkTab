<div
  class="px-4 sm:px-8 md:px-12 lg:px-16 py-4 sm:py-6 md:py-8 h-full h-screen flex flex-col bg-base-200/30"
  (contextmenu)="onContextMenu($event)"
  (dblclick)="onBackgroundDblClick($event)"
>
  <div
    class="breadcrumbs text-sm sm:text-base min-h-content mb-4 sm:mb-6 px-4 py-2 rounded-xl bg-base-100/80 backdrop-blur-md border border-base-content/10 shadow-sm inline-flex w-auto"
    *ngIf="breadcrumb.length > 1"
  >
    <ul>
      <li *ngFor="let crumb of breadcrumb; let first = first; let last = last">
        <a
          *ngIf="!last"
          class="cursor-pointer hover:text-primary hover:underline underline-offset-2 transition-colors duration-150"
          [class.ring-2]="isDroppableHover(crumb)"
          [class.ring-primary]="isDroppableHover(crumb)"
          [class.ring-offset-2]="isDroppableHover(crumb)"
          (click)="onClickCrumb(crumb)"
        >
          <span class="inline-block w-4 h-4 mr-1" *ngIf="first">
            <ng-icon name="heroHome" class="w-4 h-4" />
          </span>
          <span class="truncate max-w-[150px] sm:max-w-[250px] inline-block">{{
            crumb.title
          }}</span>
        </a>
        <a *ngIf="last" class="font-semibold cursor-not-allowed text-primary">
          <span class="truncate max-w-[150px] sm:max-w-[250px] inline-block">{{
            crumb.title
          }}</span>
        </a>
      </li>
    </ul>
  </div>

  <div
    class="bookmark-container flex-1 gap-4"
    [class.is-dragging]="!!draggedItem"
    [style.--max-columns]="bookmarkDisplayColumn"
    @fadeIn
    *ngIf="currentFolder"
    cdkDropList
    cdkDropListOrientation="mixed"
    [cdkDropListData]="currentFolder.children!"
    (cdkDropListDropped)="onDropListDropped($event)"
  >
    <ng-container
      *ngFor="let bookmark of currentFolder.children; trackBy: trackById"
    >
      <a
        *ngIf="bookmark.type === 'bookmark'"
        class="bookmark-card group flex flex-col items-center gap-2 cursor-pointer"
        [attr.href]="bookmark.url"
        [attr.data-title]="bookmark.title"
        (click)="onClick($event, bookmark)"
        (contextmenu)="onContextMenu($event, bookmark)"
        cdkDrag
        cdkDragBoundary=".bookmark-container"
        [cdkDragData]="bookmark"
        (cdkDragStarted)="onDragStarted(bookmark)"
        (cdkDragEnded)="onDragEnded()"
      >
        <div
          class="icon-container relative w-16 h-16 sm:w-20 sm:h-20 rounded-2xl flex items-center justify-center overflow-hidden group-hover:scale-110"
        >
          <div
            class="bookmark-bg-blur absolute inset-0 opacity-0 group-hover:opacity-30 transition-opacity duration-300"
            [style.backgroundImage]="'url(' + bookmark.favIconUrl + ')'"
          ></div>
          <img
            [src]="bookmark.favIconUrl"
            class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl relative z-10"
            (error)="bookmark.favIconUrl = '/assets/icons/default-icon.svg'"
          />
        </div>
        <span
          class="font-normal text-base-content/80 text-center line-clamp-2 w-full px-2 bookmark-title"
        >
          {{ bookmark.title }}
        </span>
      </a>

      <a
        *ngIf="bookmark.type === 'bookmarkFolder'"
        [id]="'bookmark-' + bookmark.id"
        class="bookmark-card group flex flex-col items-center gap-2 cursor-pointer transition-[box-shadow,outline,background] duration-200"
        [class.ring-2]="isDroppableHover(bookmark)"
        [class.ring-primary]="isDroppableHover(bookmark)"
        [class.ring-offset-2]="isDroppableHover(bookmark)"
        [class.folder-drop-target]="isDroppableHover(bookmark)"
        [attr.href]="bookmark.url"
        [attr.data-title]="bookmark.title"
        (click)="onClick($event, bookmark)"
        (contextmenu)="onContextMenu($event, bookmark)"
        (mouseenter)="onFolderMouseEnter(bookmark)"
        (mouseleave)="onFolderMouseLeave()"
        cdkDrag
        cdkDragBoundary=".bookmark-container"
        [cdkDragData]="bookmark"
        (cdkDragStarted)="onDragStarted(bookmark)"
        (cdkDragEnded)="onDragEnded()"
        [cdkDragDisabled]="draggedHoverdItem === bookmark"
      >
        <div
          class="icon-container relative w-16 h-16 sm:w-20 sm:h-20 rounded-2xl flex items-center justify-center overflow-hidden group-hover:scale-110"
          [class.icon-container-drop-target]="isDroppableHover(bookmark)"
        >
          <ng-container *ngIf="getFolderIcons(bookmark).length === 0">
            <div
              class="bookmark-bg-blur absolute inset-0 opacity-0 group-hover:opacity-30 transition-opacity duration-300"
              [style.backgroundImage]="'url(' + bookmark.favIconUrl + ')'"
            ></div>
            <img
              [src]="bookmark.favIconUrl"
              class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl relative z-10"
              (error)="bookmark.favIconUrl = '/assets/icons/folder-icon.svg'"
            />
          </ng-container>

          <div
            *ngIf="getFolderIcons(bookmark).length > 0"
            class="grid grid-cols-2 grid-rows-2 gap-1 p-2 w-full h-full relative z-10"
          >
            <ng-container *ngFor="let child of getFolderIcons(bookmark)">
              <div
                *ngIf="child"
                class="flex items-center justify-center bg-base-200/50 rounded-md overflow-hidden w-full h-full"
              >
                <img
                  [src]="child!.favIconUrl"
                  class="w-full h-full object-contain p-0.5"
                  (error)="child!.favIconUrl = '/assets/icons/default-icon.svg'"
                />
              </div>
              <div
                *ngIf="!child"
                class="bg-base-200/30 rounded-md w-full h-full"
              ></div>
            </ng-container>
          </div>
        </div>
        <span
          class="font-normal text-base-content/80 text-center line-clamp-2 w-full px-2 bookmark-title"
        >
          {{ bookmark.title }}
        </span>
      </a>
    </ng-container>
  </div>
</div>
<app-modal-host />
<app-toast-container />

<!-- Notepad FAB -->
<button
  *ngIf="enableNotepad && !notepadOpen"
  class="notepad-fab"
  (click)="notepadOpen = true"
  title="Notepad"
>
  <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 20h9"></path>
    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
  </svg>
</button>

<!-- Notepad Overlay + Panel -->
<div
  *ngIf="enableNotepad && notepadOpen"
  class="notepad-overlay"
>
  <app-notepad-panel
    [expanded]="notepadExpanded"
    (expandedChange)="onNotepadExpandedChange($event)"
    (close)="closeNotepad()"
  />
</div>
