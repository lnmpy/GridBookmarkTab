<div class="notepad-panel" [class.expanded]="expanded" (click)="$event.stopPropagation()">
  <!-- Header -->
  <div class="notepad-header">
    <input
      class="notepad-title-input"
      [(ngModel)]="noteTitle"
      (ngModelChange)="onTitleChange()"
      [placeholder]="i18n.t('untitled')"
      spellcheck="false"
    />
    <div class="notepad-header-actions">
      <button
        class="notepad-icon-btn font-size-btn"
        (click)="decreaseFontSize()"
        title="Decrease font size"
      >
        <span>A</span><span class="font-size-indicator">−</span>
      </button>
      <button
        class="notepad-icon-btn font-size-btn"
        (click)="increaseFontSize()"
        title="Increase font size"
      >
        <span>A</span><span class="font-size-indicator">+</span>
      </button>
      <button
        class="notepad-icon-btn"
        (click)="toggleExpanded()"
        title="Toggle size"
      >
        <svg *ngIf="!expanded" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 3 21 3 21 9"></polyline>
          <polyline points="9 21 3 21 3 15"></polyline>
          <line x1="21" y1="3" x2="14" y2="10"></line>
          <line x1="3" y1="21" x2="10" y2="14"></line>
        </svg>
        <svg *ngIf="expanded" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 14 10 14 10 20"></polyline>
          <polyline points="20 10 14 10 14 4"></polyline>
          <line x1="14" y1="10" x2="21" y2="3"></line>
          <line x1="3" y1="21" x2="10" y2="14"></line>
        </svg>
      </button>
      <button
        class="notepad-icon-btn"
        (click)="createNote()"
        [title]="i18n.t('newNote')"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
      <button
        class="notepad-icon-btn delete-btn"
        (click)="deleteNote(activeNoteId!)"
        [title]="i18n.t('deleteNote')"
        [disabled]="notes.length <= 1"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
      </button>
      <button class="notepad-icon-btn" (click)="onClose()" [title]="i18n.t('close')">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- Note Tabs -->
  <div class="notepad-tabs" *ngIf="notes.length > 1">
    <button
      *ngFor="let note of notes"
      class="notepad-tab"
      [class.active]="note.id === activeNoteId"
      (click)="switchTo(note.id)"
    >
      {{ getNoteLabel(note) }}
    </button>
  </div>

  <!-- Editor -->
  <textarea
    #editor
    class="notepad-editor"
    (input)="onInput()"
    [placeholder]="i18n.t('startWriting')"
    [style.fontSize.rem]="fontSize"
    spellcheck="true"
  ></textarea>
</div>
