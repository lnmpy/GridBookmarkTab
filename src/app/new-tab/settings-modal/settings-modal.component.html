<div class="modal modal-open">
  <div
    class="modal-box scrollbar-none w-11/12 max-w-lg sm:max-w-xl md:max-w-2xl"
  >
    <h3 class="font-bold text-base sm:text-lg md:text-xl">{{ i18n.t('settings') }}</h3>
    <div class="py-4 space-y-3 sm:space-y-4 w-full">
      <div
        class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2"
      >
        <label class="label text-xs sm:text-sm font-semibold">{{ i18n.t('language') }}</label>
        <select class="select select-bordered select-sm w-full sm:w-48 input-radius" [(ngModel)]="language">
          <option *ngFor="let lang of i18n.languages" [value]="lang.code">
            {{ lang.name }}
          </option>
        </select>
      </div>
      <div
        class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2"
      >
        <label class="label text-xs sm:text-sm font-semibold">{{ i18n.t('theme') }}</label>
        <select class="select select-bordered select-sm w-full sm:w-48 input-radius capitalize" [(ngModel)]="theme">
          <option *ngFor="let t of themes" [value]="t">
            {{ t }}
          </option>
        </select>
      </div>
      <div
        class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2"
      >
        <label class="label text-xs sm:text-sm font-semibold">{{ i18n.t('bookmarkRootFolder') }}</label>
        <select
          class="select select-bordered select-sm w-full sm:w-48 input-radius"
          [(ngModel)]="bookmarkRootFolderId"
        >
          <option
            *ngFor="let f of bookmarkRootFolders"
            [value]="f.id"
            [ngStyle]="{ 'padding-left': f.depth + 'rem' }"
          >
            {{ f.title }}
          </option>
        </select>
      </div>
      <div
        class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2"
      >
        <div class="flex flex-col gap-1">
          <label class="label text-xs sm:text-sm font-semibold">{{ i18n.t('searchShortcut') }}</label>
          <span class="text-xs text-base-content/60"
            >{{ i18n.t('clickToChange') }}</span
          >
        </div>
        <input
          type="text"
          [value]="shortcutString"
          (keydown)="onShortcutKeydown($event)"
          class="input input-bordered input-sm w-full sm:w-48 cursor-pointer input-radius"
          readonly
        />
      </div>
      <div
        class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2"
      >
        <label class="label text-xs sm:text-sm font-semibold">{{ i18n.t('defaultSearchScope') }}</label>
        <select
          class="select select-bordered select-sm w-full sm:w-48 input-radius"
          [(ngModel)]="searchScope"
        >
          <option value="root">{{ i18n.t('rootFolderScope') }}</option>
          <option value="all">{{ i18n.t('allBookmarksScope') }}</option>
          <option value="custom">{{ i18n.t('customWhitelist') }}</option>
        </select>
      </div>
      <!-- Whitelist Folders Multi-Select (shown when custom is selected) -->
      <div *ngIf="searchScope === 'custom'" class="flex flex-col gap-2 p-3 bg-base-200/50 rounded-lg border border-base-content/10">
        <div class="flex items-center justify-between">
          <label class="text-xs font-semibold">{{ i18n.t('searchFolderWhitelist') }}</label>
          <div class="flex gap-1">
            <button type="button" class="btn btn-xs btn-ghost" (click)="selectAllWhitelistFolders()">{{ i18n.t('selectAll') }}</button>
            <button type="button" class="btn btn-xs btn-ghost" (click)="clearWhitelistFolders()">{{ i18n.t('clearSelection') }}</button>
          </div>
        </div>
        <div class="max-h-36 overflow-y-auto space-y-1 text-xs pr-1">
          <div
            *ngFor="let f of bookmarkRootFolders"
            class="flex items-center gap-2 px-2 py-1 rounded hover:bg-base-200 cursor-pointer select-none"
            [ngStyle]="{ 'padding-left': (f.depth || 0) * 0.75 + 0.5 + 'rem' }"
            (click)="toggleWhitelistFolder(f.id)"
          >
            <input
              type="checkbox"
              [checked]="isWhitelistFolderSelected(f.id)"
              class="checkbox checkbox-primary checkbox-xs pointer-events-none"
            />
            <span>📁</span>
            <span class="truncate">{{ f.title }}</span>
          </div>
        </div>
      </div>
      <div
        class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2"
      >
        <div class="flex flex-col gap-1">
          <label class="label text-xs sm:text-sm font-semibold">{{ i18n.t('maxColumns') }}</label>
          <span class="text-xs text-base-content/60"
            >{{ i18n.t('autoAdjusts') }}</span
          >
        </div>
        <input
          type="number"
          [min]="columnsMin"
          [max]="columnsMax"
          [(ngModel)]="bookmarkDisplayColumn"
          class="input input-bordered input-sm w-full sm:w-48 input-radius"
        />
      </div>
      <div
        class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2"
      >
        <div class="flex flex-col gap-1">
          <label class="label text-xs sm:text-sm font-semibold">{{ i18n.t('bookmarkSize') }}</label>
          <span class="text-xs text-base-content/60"
            >{{ i18n.t('autoAdjusts') }}</span
          >
        </div>
        <input
          type="number"
          [min]="40"
          [max]="120"
          [(ngModel)]="bookmarkSize"
          class="input input-bordered input-sm w-full sm:w-48 input-radius"
        />
      </div>
      <div
        class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2"
      >
        <label class="label text-xs sm:text-sm font-semibold">{{ i18n.t('openInNewTabSetting') }}</label>
        <input
          type="checkbox"
          [(ngModel)]="bookmarkOpenInNewTab"
          class="toggle toggle-sm toggle-primary"
        />
      </div>

    </div>
    <div class="modal-action flex-col sm:flex-row items-center justify-between gap-2 mt-6">
      <button
        type="button"
        class="btn btn-sm btn-ghost text-xs text-primary font-normal p-0 hover:bg-transparent hover:underline"
        (click)="openFullOptions()"
      >
        <span>{{ i18n.t('openFullOptions') }} ↗</span>
      </button>
      <div class="flex items-center gap-2 w-full sm:w-auto">
        <button
          class="btn btn-sm btn-primary btn-refined button-radius flex-1 sm:flex-initial"
          (click)="onConfirm()"
        >
          {{ i18n.t('save') }}
        </button>
        <button class="btn btn-sm btn-refined button-radius flex-1 sm:flex-initial" (click)="onCancel()">
          {{ i18n.t('cancel') }}
        </button>
      </div>
    </div>
  </div>
</div>
