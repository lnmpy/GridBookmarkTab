<div class="modal modal-open">
  <div
    class="modal-box scrollbar-none w-11/12 max-w-lg sm:max-w-xl md:max-w-2xl"
  >
    <h3 class="font-bold text-base sm:text-lg md:text-xl">{{ i18n.t('settings') }}</h3>
    <div class="py-4 space-y-3 sm:space-y-4 w-full">
      <div
        class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2"
      >
        <label class="label text-xs sm:text-sm">{{ i18n.t('language') }}</label>
        <select class="select select-sm w-full sm:w-48" [(ngModel)]="language">
          <option *ngFor="let lang of i18n.languages" [value]="lang.code">
            {{ lang.name }}
          </option>
        </select>
      </div>
      <div
        class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2"
      >
        <label class="label text-xs sm:text-sm">{{ i18n.t('theme') }}</label>
        <select class="select select-sm w-full sm:w-48" [(ngModel)]="theme">
          <option *ngFor="let t of themes" [value]="t">
            {{ t }}
          </option>
        </select>
      </div>
      <div
        class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2"
      >
        <label class="label text-xs sm:text-sm">{{ i18n.t('bookmarkRootFolder') }}</label>
        <select
          class="select select-sm w-full sm:w-48"
          [(ngModel)]="bookmarkRootFolderId"
        >
          <option
            *ngFor="let f of bookmarkRootFolders"
            [value]="f.id"
            [ngStyle]="{ 'padding-left': f.depth + 'rem' }"
          >
            {{ f.title }}
          </option>
        </select>
      </div>
      <div
        class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2"
      >
        <div class="flex flex-col gap-1">
          <label class="label text-xs sm:text-sm">{{ i18n.t('searchShortcut') }}</label>
          <span class="text-xs text-base-content/60"
            >{{ i18n.t('clickToChange') }}</span
          >
        </div>
        <input
          type="text"
          [value]="shortcutString"
          (keydown)="onShortcutKeydown($event)"
          class="input input-sm w-full sm:w-48 text-center cursor-pointer"
          readonly
        />
      </div>
      <div
        class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2"
      >
        <div class="flex flex-col gap-1">
          <label class="label text-xs sm:text-sm">{{ i18n.t('maxColumns') }}</label>
          <span class="text-xs text-base-content/60"
            >{{ i18n.t('autoAdjusts') }}</span
          >
        </div>
        <input
          type="number"
          [min]="columnsMin"
          [max]="columnsMax"
          [(ngModel)]="bookmarkDisplayColumn"
          class="input input-sm w-full sm:w-1/10"
        />
      </div>
      <div
        class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2"
      >
        <div class="flex flex-col gap-1">
          <label class="label text-xs sm:text-sm">{{ i18n.t('bookmarkSize') }}</label>
          <span class="text-xs text-base-content/60"
            >{{ i18n.t('autoAdjusts') }}</span
          >
        </div>
        <input
          type="number"
          [min]="40"
          [max]="120"
          [(ngModel)]="bookmarkSize"
          class="input input-sm w-full sm:w-1/10"
        />
      </div>
      <div
        class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2"
      >
        <label class="label text-xs sm:text-sm">{{ i18n.t('openInNewTabSetting') }}</label>
        <input
          type="checkbox"
          [(ngModel)]="bookmarkOpenInNewTab"
          class="toggle toggle-sm"
        />
      </div>
      <div
        class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2"
      >
        <label class="label text-xs sm:text-sm">{{ i18n.t('enableNotepad') }}</label>
        <input
          type="checkbox"
          [(ngModel)]="enableNotepad"
          class="toggle toggle-sm"
        />
      </div>
    </div>
    <div class="modal-action flex-col sm:flex-row gap-2">
      <button
        class="btn btn-sm btn-primary w-full sm:w-auto"
        (click)="onConfirm()"
      >
        {{ i18n.t('save') }}
      </button>
      <button class="btn btn-sm w-full sm:w-auto" (click)="onCancel()">
        {{ i18n.t('cancel') }}
      </button>
    </div>
  </div>
</div>
