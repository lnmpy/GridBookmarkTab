<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Bookmark Gradient (same blue theme as folder) -->
    <linearGradient id="bookmarkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>

    <!-- Glassy shine -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="rgba(0,0,0,0.2)"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Bookmark Shape -->
    <path
      d="M 16 8 C 13.8 8 12 9.8 12 12 L 12 56 L 32 44 L 52 56 L 52 12 C 52 9.8 50.2 8 48 8 L 16 8 Z"
      fill="url(#bookmarkGradient)"
    />

    <!-- Shine effect -->
    <path
      d="M 12 8 L 52 8 L 52 30 C 52 30 32 36 12 30 Z"
      fill="url(#shine)"
    />
    
    <!-- Star/Icon on top (optional detail) -->
    <circle cx="32" cy="24" r="6" fill="white" opacity="0.3" />
  </g>
</svg>
