<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Premium Blue Gradient -->
    <linearGradient id="folderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>

    <!-- Top Tab Gradient -->
    <linearGradient id="folderTabGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>

    <!-- Glassy shine -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="rgba(0,0,0,0.2)"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Back plate (top part of folder) -->
    <path
      d="M 6 14 C 6 11.8 7.8 10 10 10 L 22 10 L 26 14 L 54 14 C 56.2 14 58 15.8 58 18 L 58 50 C 58 52.2 56.2 54 54 54 L 10 54 C 7.8 54 6 52.2 6 50 Z"
      fill="url(#folderTabGradient)"
    />

    <!-- Front plate -->
    <path
      d="M 6 22 L 58 22 L 58 50 C 58 52.2 56.2 54 54 54 L 10 54 C 7.8 54 6 52.2 6 50 Z"
      fill="url(#folderGradient)"
    />
    
    <!-- Shine effect on front plate -->
    <path
      d="M 6 22 L 58 22 L 58 36 C 58 36 40 42 6 36 Z"
      fill="url(#shine)"
    />
  </g>
</svg>
