<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Modern gradient for folder -->
    <linearGradient id="folderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>

    <!-- Lighter gradient for folder tab -->
    <linearGradient id="folderTabGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>

    <!-- Shadow -->
    <filter id="folderShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Shadow layer -->
  <g filter="url(#folderShadow)">
    <!-- Folder tab (top part) -->
    <path
      d="M 8 16 L 8 14 C 8 11.8 9.8 10 12 10 L 24 10 L 28 14 L 52 14 C 54.2 14 56 15.8 56 18 L 56 20 Z"
      fill="url(#folderTabGradient)"
      rx="4"
    />

    <!-- Main folder body with rounded corners -->
    <rect
      x="8"
      y="20"
      width="48"
      height="32"
      rx="6"
      ry="6"
      fill="url(#folderGradient)"
    />

    <!-- Subtle highlight on top edge -->
    <rect
      x="10"
      y="22"
      width="44"
      height="2"
      rx="1"
      fill="white"
      opacity="0.3"
    />

    <!-- Inner shadow effect (depth) -->
    <rect
      x="12"
      y="26"
      width="40"
      height="22"
      rx="4"
      fill="black"
      opacity="0.08"
    />
  </g>
</svg>
